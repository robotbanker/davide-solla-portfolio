name: Website CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify generated sitemap
        run: |
          npm run sitemap:build
          git diff --exit-code -- sitemap.xml

      - name: Check patch whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Audit rendered SEO and local assets
        run: |
          npm start > /tmp/website-seo-server.log 2>&1 &
          website_server_pid=$!
          trap 'kill "$website_server_pid" 2>/dev/null || true' EXIT
          node -e 'async function ready() { for (let i = 0; i < 40; i++) { try { const r = await fetch("http://localhost:4173/robots.txt"); if (r.ok) return; } catch {} await new Promise(resolve => setTimeout(resolve, 250)); } process.exit(1); } ready();'
          npm run seo:audit
